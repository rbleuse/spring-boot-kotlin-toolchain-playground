services:
  postgres:
    image: postgres:18.7-alpine
    environment:
      POSTGRES_DB: toolchain_demo
      POSTGRES_USER: toolchain_demo
      POSTGRES_PASSWORD: toolchain_demo
    ports:
      - "5432:5432"
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U toolchain_demo -d toolchain_demo" ]
      interval: 10s
      timeout: 5s
      retries: 5
