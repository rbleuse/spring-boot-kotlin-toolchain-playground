product: jvm/app
layout: maven-like

settings:
  springBoot:
    enabled: true
    version: 4.1.2
  kotlin:
    version: 2.4.21
    allOpen:
      enabled: true
      presets: [ spring ]
    noArg:
      enabled: true
      presets: [ jpa ]
  jvm:
    jdk:
      version: 25
    release: 25
    mainClass: io.github.rbleuse.ToolchainDemoApplicationKt

dependencies:
  - $kotlin.reflect
  - $spring.boot.starter.actuator
  - $spring.boot.starter.data.jpa
  - $spring.boot.starter.validation
  - $spring.boot.starter.webmvc
  - $spring.boot.docker.compose
  - tools.jackson.module:jackson-module-kotlin
  - $libs.postgresql: runtime-only

test-dependencies:
  - $spring.boot.starter.test.data.jpa
