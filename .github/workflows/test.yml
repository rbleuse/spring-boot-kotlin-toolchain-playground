name: Test

on:
  push:
    branches: [ main ]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7.0.1

      - uses: actions/setup-java@v6.3.0
        with:
          distribution: 'zulu'
          java-version: '25.0.4'

      - name: Run tests
        run: ./kotlin test
